<div class="academic-split-slide">
  <div class="row g-4 align-items-center">
    <div class="col-12 {% if image %}col-md-6{% else %}col-md-12{% endif %}">
      <h2 class="academic-section-title">{{ title }}</h2>
      <div class="academic-text-content">
        {{ text|safe }}
      </div>
    </div>
    {% if image %}
    <div class="col-12 col-md-6">
      <img src="{{ image }}" class="img-fluid rounded" alt="imagem" />
    </div>
    {% endif %}
  </div>
</div>
