<div class="gallery-slide">
  <div class="row g-4">
    {% for url in images %}
      <div class="col-6 {% if images|length > 4 %}col-md-4 col-lg-3{% else %}col-md-6{% endif %}">
        <div class="gallery-item">
          <img src="{{ url }}" class="img-fluid" loading="lazy" alt="imagem {{ loop.index }}" />
        </div>
      </div>
    {% endfor %}
  </div>
</div>
