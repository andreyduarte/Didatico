<div class="hero-slide">
  <div class="row align-items-center g-5">
    <div class="col-12 {% if image %}col-lg-6{% else %}col-lg-12 text-center{% endif %}">
      <h1 class="display-6">{{ title }}</h1>
    </div>
    {% if image %}
    <div class="col-12 col-lg-6">
      <div class="hero-image">
        <img src="{{ image }}" class="img-fluid" loading="lazy" alt="imagem" />
      </div>
    </div>
    {% endif %}
  </div>
</div>
