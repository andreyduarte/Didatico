<div class="slide-sumario">
  <div class="sumario-sidebar" style="background-color: {{ bg_color }};">
    <h2 class="sumario-title">{{ title }}</h2>
    <p class="sumario-paragraph">{{ paragraph }}</p>
  </div>
  <div class="sumario-main">
    {% if image %}
    <img src="{{ image }}" alt="imagem" class="sumario-image">
    {% else %}
    <div class="sumario-content">{{ content | safe }}</div>
    {% endif %}
  </div>
</div>
