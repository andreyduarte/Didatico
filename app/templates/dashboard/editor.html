<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editor • {{ lesson.title }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/' + lesson.theme + '.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/editor.css') }}">
</head>
<body>
<div class="immersive-editor">
  <!-- Preview em Tela Cheia (Fundo) -->
  <div class="preview-fullscreen" id="slidePreview">
    <div class="preview-placeholder">Selecione um slide para editar</div>
  </div>

  <!-- Barra Superior Flutuante -->
  <div class="floating-toolbar">
    <div class="d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center gap-2">
        <a href="{{ url_for('dashboard.index') }}" class="btn btn-sm btn-outline-light">← Voltar</a>
        <span class="text-white fw-semibold">{{ lesson.title }}</span>
      </div>
      <div class="d-flex align-items-center gap-2">
        <label class="small mb-0 me-2 text-white">Layout:</label>
        <select id="layoutSelect" class="form-select form-select-sm" style="width: 150px;" disabled>
          {% for layout in layouts %}
          <option value="{{ layout.value }}">{{ layout.label }}</option>
          {% endfor %}
        </select>
        <label class="small mb-0 me-2 ms-3 text-white">Cor:</label>
        <input type="color" id="colorPicker" class="form-control form-control-sm" style="width: 60px; height: 32px;" value="#6366f1" disabled>
        <button id="saveBtn" class="btn btn-sm btn-success" disabled>Salvar</button>
        <a href="{{ url_for('public.view_lesson', slug=lesson.slug) }}" class="btn btn-sm btn-light" target="_blank">Apresentar</a>
      </div>
    </div>
  </div>

  <!-- Painel Esquerdo Flutuante: Thumbnails -->
  <div class="floating-panel floating-left">
    <button id="addSlideBtn" class="btn btn-sm btn-primary w-100 mb-2">+ Novo Slide</button>
    <div id="thumbnailsList" class="thumbnails-scroll">
      <!-- Thumbnails serão carregados via JS -->
    </div>
  </div>

  <!-- Modal de Imagem -->
  <div class="modal fade" id="imageModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content glass-modal">
        <div class="modal-header border-0">
          <h5 class="modal-title text-white">Editar Imagem</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label text-white">URL da Imagem</label>
            <input type="text" class="form-control glass-input" id="imageUrlInput" placeholder="https://exemplo.com/imagem.jpg">
          </div>
          <div class="text-center text-white-50 small mb-3">ou</div>
          <div>
            <label class="btn btn-outline-light w-100" for="imageFileInput">
              <i class="bi bi-upload"></i> Upload de Arquivo
            </label>
            <input type="file" class="d-none" id="imageFileInput" accept="image/*">
          </div>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="saveImageBtn">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Indicador de Navegação -->
  <div class="navigation-hint">
    <span class="kbd-key">←</span>
    <span class="kbd-key">→</span>
    <span class="text-white-50 small ms-2">Navegar</span>
  </div>
</div>

<script>
  // Variáveis Jinja para o JavaScript externo
  window.EDITOR_CONFIG = {
    lessonId: {{ lesson.id }},
    lessonTheme: '{{ lesson.theme }}',
    csrfToken: '{{ csrf_token() }}'
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
