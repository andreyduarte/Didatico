<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Aula{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root {
        --bg: #0a0d14;
        --bg-secondary: #151821;
        --text: #ffffff;
        --text-secondary: #a8b3c8;
        --accent: #6366f1;
        --accent-hover: #818cf8;
        --border: rgba(255, 255, 255, 0.08);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      html, body {
        height: 100%;
        overflow-x: hidden;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        line-height: 1.6;
      }

      main {
        position: relative;
      }

      .lesson-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        background: rgba(10, 13, 20, 0.85);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        padding: 1rem 2rem;
        transition: all 0.3s ease;
      }

      .lesson-header.hidden {
        transform: translateY(-100%);
        opacity: 0;
      }

      .lesson-header h1 {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text);
        margin: 0;
      }

      .lesson-header p {
        font-size: 0.875rem;
        color: var(--text-secondary);
        margin: 0.25rem 0 0 0;
      }

      .slide {
        min-height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 5rem 2rem 2rem;
        position: relative;
      }

      .slide-content {
        width: 100%;
        max-width: 1400px;
        margin: 0 auto;
      }

      .slide-nav {
        position: absolute;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 1rem;
        z-index: 10;
      }

      .slide-nav-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 0.5rem 1.5rem;
        border-radius: 8px;
        text-decoration: none;
        font-size: 0.875rem;
        transition: all 0.2s ease;
        backdrop-filter: blur(8px);
      }

      .slide-nav-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: var(--accent);
        color: var(--text);
        transform: translateY(-2px);
      }

      .progress-indicator {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        background: rgba(10, 13, 20, 0.9);
        backdrop-filter: blur(12px);
        border: 1px solid var(--border);
        padding: 0.75rem 1.25rem;
        border-radius: 12px;
        font-size: 0.875rem;
        color: var(--text-secondary);
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      }

      .progress-indicator.hidden {
        display: none;
      }

      .progress-current {
        color: var(--text);
        font-weight: 600;
        font-size: 1rem;
      }

      .progress-total {
        color: var(--text-secondary);
      }

      .kbd-hint {
        display: flex;
        gap: 0.5rem;
        margin-left: 0.75rem;
        padding-left: 0.75rem;
        border-left: 1px solid var(--border);
      }

      .kbd {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--border);
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
        font-size: 0.75rem;
        font-family: 'Courier New', monospace;
        color: var(--text-secondary);
      }

      h1, h2, h3 {
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }

      h1.display-6 {
        font-size: clamp(2.5rem, 5vw, 4rem);
        font-weight: 800;
        line-height: 1.1;
      }

      h2.display-6 {
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 700;
      }

      img {
        max-width: 100%;
        height: auto;
        display: block;
      }

      /* Hero Slide Styles */
      .hero-slide {
        width: 100%;
      }

      .hero-slide h1 {
        margin-bottom: 0;
      }

      .hero-image {
        position: relative;
      }

      .hero-image img {
        width: 100%;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }

      /* Two Columns Slide Styles */
      .two-cols-slide {
        width: 100%;
      }

      .two-cols-content {
        font-size: clamp(1rem, 2vw, 1.25rem);
        line-height: 1.8;
        color: var(--text-secondary);
      }

      .two-cols-content h1,
      .two-cols-content h2,
      .two-cols-content h3,
      .two-cols-content h4,
      .two-cols-content h5,
      .two-cols-content h6 {
        color: var(--text);
        margin-top: 2rem;
        margin-bottom: 1rem;
      }

      .two-cols-content h1:first-child,
      .two-cols-content h2:first-child,
      .two-cols-content h3:first-child {
        margin-top: 0;
      }

      .two-cols-content p {
        margin-bottom: 1.5rem;
      }

      .two-cols-content p:last-child {
        margin-bottom: 0;
      }

      .two-cols-content ul,
      .two-cols-content ol {
        margin-bottom: 1.5rem;
        padding-left: 1.5rem;
      }

      .two-cols-content li {
        margin-bottom: 0.5rem;
      }

      .two-cols-image img {
        width: 100%;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }

      /* Gallery Slide Styles */
      .gallery-slide {
        width: 100%;
      }

      .gallery-item {
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        aspect-ratio: 4 / 3;
      }

      .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s ease;
      }

      .gallery-item:hover img {
        transform: scale(1.05);
      }

      /* Quote Slide Styles */
      .quote-slide {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
      }

      .quote-slide blockquote {
        border: none;
        padding: 0;
      }

      .quote-slide p {
        color: var(--text);
        font-style: italic;
        margin: 0;
        line-height: 1.4;
      }

      @media (max-width: 768px) {
        .lesson-header {
          padding: 0.75rem 1rem;
        }

        .lesson-header h1 {
          font-size: 0.95rem;
        }

        .lesson-header p {
          font-size: 0.8rem;
        }

        .slide {
          padding: 4rem 1rem 1.5rem;
        }

        .slide-nav {
          bottom: 1rem;
          gap: 0.5rem;
        }

        .slide-nav-btn {
          padding: 0.4rem 1rem;
          font-size: 0.8rem;
        }

        .progress-indicator {
          bottom: 1rem;
          right: 1rem;
          padding: 0.5rem 1rem;
          font-size: 0.8rem;
        }

        .kbd-hint {
          display: none;
        }
      }

      @media (max-width: 576px) {
        .slide {
          padding: 3.5rem 1rem 1rem;
        }
      }
    </style>
  </head>
  <body>
    {% block header %}{% endblock %}
    <main>
      {% block content %}{% endblock %}
    </main>
    <div id="progress" class="progress-indicator hidden">
      <span class="progress-current" id="cur">1</span>
      <span class="progress-total">/ <span id="tot">1</span></span>
      <span class="kbd-hint">
        <span class="kbd">←</span>
        <span class="kbd">→</span>
      </span>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      (function(){
        const slides = Array.from(document.querySelectorAll('.slide'));
        const tot = slides.length;
        const curEl = document.getElementById('cur');
        const totEl = document.getElementById('tot');
        const prog = document.getElementById('progress');
        const header = document.querySelector('.lesson-header');
        
        if (!slides.length) return;
        totEl.textContent = String(tot);
        prog.classList.remove('hidden');

        let lastScrollTime = 0;
        let headerVisible = true;

        function scrollToIndex(i){
          if (i < 1 || i > tot) return;
          const target = document.getElementById('s'+i);
          if (!target) return;
          
          target.scrollIntoView({behavior:'smooth', block:'start'});
          location.hash = 's='+i;
          curEl.textContent = String(i);
          
          lastScrollTime = Date.now();
          if (header) {
            headerVisible = true;
            header.classList.remove('hidden');
          }
        }

        // Set current by hash on load
        const m = location.hash.match(/s=(\d+)/);
        if (m) {
          curEl.textContent = m[1];
          setTimeout(() => {
            scrollToIndex(Number(m[1]));
          }, 100);
        }

        // Update on intersection
        const io = new IntersectionObserver((entries)=>{
          const visible = entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio)[0];
          if (visible) {
            const id = visible.target.id || '';
            const m2 = id.match(/s(\d+)/);
            if (m2) {
              curEl.textContent = m2[1];
            }
          }
        }, { threshold:[0.5] });
        
        slides.forEach(s=>io.observe(s));

        // Header auto-hide on scroll
        if (header) {
          let scrollTimeout;
          window.addEventListener('scroll', () => {
            clearTimeout(scrollTimeout);
            if (headerVisible) {
              scrollTimeout = setTimeout(() => {
                header.classList.add('hidden');
                headerVisible = false;
              }, 2000);
            }
          });

          window.addEventListener('mousemove', (e) => {
            if (e.clientY < 100 && !headerVisible) {
              header.classList.remove('hidden');
              headerVisible = true;
            }
          });
        }

        // Keyboard navigation
        window.addEventListener('keydown', (ev)=>{
          const cur = Number(curEl.textContent || '1');
          if (ev.key === 'ArrowRight' || ev.key === 'PageDown') {
            ev.preventDefault();
            scrollToIndex(cur+1);
          } else if (ev.key === 'ArrowLeft' || ev.key === 'PageUp') {
            ev.preventDefault();
            scrollToIndex(cur-1);
          } else if (ev.key === 'Home') {
            ev.preventDefault();
            scrollToIndex(1);
          } else if (ev.key === 'End') {
            ev.preventDefault();
            scrollToIndex(tot);
          }
        });
      })();
    </script>
  </body>
  </html>
